name: Release

# Release Please turns Conventional Commits on master into a release PR
# ("chore(main): release vX.Y.Z") that bumps package.json and CHANGELOG.md.
# Merging that PR tags the commit and publishes the GitHub Release. The same
# merge push drives this workflow, so when Release Please reports that a
# release was just created, the second job builds the exact tagged commit
# through all CI gates and attaches the bundle to it.
#
# NOTE: the bundle job cannot hang off the `release: published` event —
# releases created with the workflow's own GITHUB_TOKEN do not trigger new
# workflow runs (GitHub's anti-recursion rule). Reacting to the push that
# merged the release PR keeps everything in one user-initiated run.
on:
  push:
    branches: [master]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Manage release PR and tags
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: google-github-actions/release-please-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Runs only on pushes that actually cut a release (i.e. the release PR was
  # merged). Builds the tagged commit through the same gates as CI and
  # attaches the bundle, so every release carries its immutable artifact.
  attach-bundle:
    name: Attach built bundle to the release
    runs-on: ubuntu-latest
    needs: release-please
    if: needs.release-please.outputs.releases_created == 'true'
    permissions:
      contents: write
    steps:
      - name: Checkout the released tag
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Set up Node.js (from .nvmrc)
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Pin npm to the lockfile's generator version
        run: npm install --global npm@11.17.0

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Run tests with coverage thresholds
        run: npm run test:coverage -- --coverage.reporter=text-summary

      - name: Security audit
        run: npm audit --audit-level=high

      - name: Build production bundle
        run: npm run build

      - name: Archive the bundle
        run: |
          tag="${{ needs.release-please.outputs.tag_name }}"
          zip -r "timaoflix-${tag}.zip" dist

      - name: Upload the archive to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ needs.release-please.outputs.tag_name }}"
          gh release upload "$tag" "timaoflix-${tag}.zip" --clobber
